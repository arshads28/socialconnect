<style>
    /* Popup Logic */
    #inbox-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
    .inbox-modal { background: #fff; width: 100%; max-width: 500px; height: 80vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.3s ease; }
    
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .list-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
    .user-row { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f9f9f9; cursor: pointer; transition: 0.2s; }
    .user-row:hover { background: #f0f0f0; }
    
    .u-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 1px solid #eee; }
    .u-avatar-placeholder { width: 45px; height: 45px; background: #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-size: 20px; }
    
    .u-badge { background: #25D366; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: auto; }
</style>

<div id="inbox-overlay" onclick="closeInbox(event)">
    <div class="inbox-modal">
        <div class="list-header">
            <h3>Messages</h3>
            <button onclick="toggleInbox()" style="border:none; background:none; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        
        <div id="inbox-loading" style="display:none; text-align:center; padding:20px; color:#666;">
            Refreshing...
        </div>

        <div id="inbox-user-list" style="overflow-y: auto;">
            {% for user in chat_users %}
            <div class="user-row" onclick="openChatPopup('{{ user.username }}', '{% if user.avatar %}{{ user.avatar.url }}{% endif %}')" data-username="{{ user.username }}">
                {% if user.avatar %}
                    <img src="{{ user.avatar.url }}" class="u-avatar">
                {% else %}
                    <div class="u-avatar-placeholder">👤</div>
                {% endif %}
                
                <div>
                    <div style="font-weight:600;">{{ user.username }}</div>
                    <div class="u-status" style="font-size:12px; color:gray;">
                        {% if user.is_online %}
                            <span style="color:#25D366">● Online</span>
                        {% else %}
                            Offline
                        {% endif %}
                    </div>
                </div>
                <span id="badge-{{ user.username }}" class="u-badge" style="{% if user.unread_count == 0 %}display:none;{% endif %}">{{ user.unread_count }}</span>
            </div>
            {% empty %}
                <div style="padding:20px; text-align:center; color:#999;">No messages yet.</div>
            {% endfor %}
        </div>
    </div>
</div>

<script>
    function toggleInbox(e) {
        if(e) e.preventDefault();
        const el = document.getElementById('inbox-overlay');
        
        if (el.style.display === 'flex') {
            el.style.display = 'none';
        } else {
            el.style.display = 'flex';
            fetchInboxData(); 
        }
    }

    function closeInbox(e) {
        if (e.target.id === 'inbox-overlay') toggleInbox();
    }
    
    async function fetchInboxData() {
        const listContainer = document.getElementById('inbox-user-list'); 
        const loader = document.getElementById('inbox-loading');
        
        if (!listContainer || !loader) return;

        loader.style.display = 'block';
        listContainer.style.opacity = '0.5';

        try {
            const response = await fetch('/chat/inbox/');
            if (!response.ok) throw new Error("API Request Failed");
            
            const data = await response.json();
            
            let html = "";
            if (!data.users || data.users.length === 0) {
                html = '<div style="padding:20px; text-align:center; color:#999;">No messages yet.</div>';
            } else {
                data.users.forEach(user => {
                    const statusHtml = user.is_online 
                        ? `<span style="color:#25D366">● Online</span>` 
                        : (user.status_text || "Offline");
                        
                    const badgeDisplay = user.unread_count > 0 ? 'block' : 'none';
                    
                    let avatarHtml = `<div class="u-avatar-placeholder">👤</div>`;
                    const safeAvatarUrl = user.avatar_url ? user.avatar_url : "";
                    
                    if (user.avatar_url) {
                        avatarHtml = `<img src="${user.avatar_url}" class="u-avatar">`;
                    }

                    // ADDED CLASS 'u-status' HERE AS WELL
                    html += `
                    <div class="user-row" onclick="openChatPopup('${user.username}', '${safeAvatarUrl}')" data-username="${user.username}">
                        ${avatarHtml}
                        <div>
                            <div style="font-weight:600;">${user.username}</div>
                            <div class="u-status" style="font-size:12px; color:gray;">${statusHtml}</div>
                        </div>
                        <span id="badge-${user.username}" class="u-badge" style="display:${badgeDisplay}">
                            ${user.unread_count}
                        </span>
                    </div>`;
                });
            }
            listContainer.innerHTML = html;

        } catch (error) {
            console.error("Error fetching inbox:", error);
        } finally {
            loader.style.display = 'none';
            listContainer.style.opacity = '1';
        }
    }

    document.addEventListener('chatNotification', function(e) {
        const data = e.detail;
        const badge = document.getElementById(`badge-${data.sender}`);
        if(badge) {
            badge.innerText = (parseInt(badge.innerText) || 0) + 1;
            badge.style.display = 'block';
            const list = document.getElementById('inbox-user-list');
            const row = document.querySelector(`.user-row[data-username='${data.sender}']`);
            if(list && row) list.prepend(row);
        }
    });
</script>
