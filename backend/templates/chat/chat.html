{% extends "base.html" %}
{% block content %}

<style>
    /* ============================
       INSTAGRAM STYLE CSS
       ============================ */
    body { margin: 0; background-color: #fafafa; }

    .chat-container {
        background: #fff;
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    @media (min-width: 768px) {
        .chat-container {
            max-width: 600px;
            height: 85vh;
            margin: 30px auto;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
    }

    @media (max-width: 767px) {
        .chat-container {
            width: 100%;
            height: 100vh;
            border: none;
            margin: 0;
        }
    }

    .chat-header {
        height: 60px;
        padding: 0 15px;
        border-bottom: 1px solid #efefef;
        display: flex;
        align-items: center;
        flex-shrink: 0;
        background: #fff;
        border-radius: 8px 8px 0 0;
    }

    #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background-color: #fff;
        display: flex;
        flex-direction: column;
    }
    
    #chat-box::-webkit-scrollbar { width: 6px; }
    #chat-box::-webkit-scrollbar-thumb { background-color: #cccccc; border-radius: 4px; }

    /* Bubbles */
    .msg-row {
        width: 100%;
        display: flex;
        margin-bottom: 8px;
    }

    .bubble {
        padding: 10px 14px;
        border-radius: 22px;
        font-size: 14px;
        line-height: 1.4;
        max-width: 70%;
        word-wrap: break-word;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .sent-row { justify-content: flex-end; }
    .sent-bubble {
        background: linear-gradient(90deg, #962fbf, #4f5bd5);
        color: white;
        border-bottom-right-radius: 4px;
    }

    .received-row { justify-content: flex-start; }
    .received-bubble {
        background-color: #efefef;
        color: #262626;
        border: 1px solid #efefef;
        border-bottom-left-radius: 4px;
    }

    /* Timestamp & Ticks */
    .msg-footer {
        font-size: 10px;
        margin-top: 4px;
        align-self: flex-end;
        display: flex;
        align-items: center;
        opacity: 0.8;
    }
    
    .sent-bubble .msg-footer { color: #e0e0e0; }
    .received-bubble .msg-footer { color: #8e8e8e; }

    /* Tick Styling */
    .tick {
        font-size: 14px; /* slightly larger than time */
        margin-left: 3px;
        font-weight: bold;
        line-height: 10px;
    }
    
    .tick.read { color: #4fc3f7; /* Cyan/Blue for Read */ }
    .tick.delivered { color: #e0e0e0; /* Light Gray */ }

    .input-area {
        padding: 15px;
        border-top: 1px solid #efefef;
        display: flex;
        align-items: center;
        background: #fff;
        border-radius: 0 0 8px 8px;
    }

    .input-wrapper {
        flex: 1;
        border: 1px solid #dbdbdb;
        border-radius: 22px;
        padding: 8px 15px;
        display: flex;
        align-items: center;
        background: #fff;
    }
</style>


<div class="chat-container">
    <div class="chat-header">
        <div style="width: 32px; height: 32px; border-radius: 50%; background: #dbdbdb; margin-right: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
             <svg aria-label="Profile" color="#fff" fill="#fff" height="24" viewBox="0 0 48 48" width="24"><path d="M24 0C10.7 0 0 10.7 0 24s10.7 24 24 24 24-10.7 24-24S37.3 0 24 0zm0 7.2c4.1 0 7.4 3.3 7.4 7.4 0 4.1-3.3 7.4-7.4 7.4-4.1 0-7.4-3.3-7.4-7.4 0-4.1 3.3-7.4 7.4-7.4zm0 33.6c-5.3 0-10-2.3-13.2-5.9 1-5.1 5.5-9 10.8-9h4.8c5.3 0 9.8 3.8 10.8 9-3.2 3.6-7.9 5.9-13.2 5.9z"></path></svg>
        </div>
        
        <div style="display: flex; flex-direction: column;">
            <strong style="font-size: 16px;">{{ other_user.username }}</strong>
            
            <span id="user-status" style="font-size:12px; color:#8e8e8e; height: 14px;">
                {% if other_user.is_online %}
                    <span style="color: #25D366; font-weight: 500;">Active now</span>
                {% else %}
                    {{ last_seen_text }}
                {% endif %}
            </span>
            
            <span id="typing-indicator" style="font-size:12px; color:#8e8e8e; display:none;">typing...</span>
        </div>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
        <div class="input-wrapper">
            <span style="font-size: 20px; margin-right: 8px; cursor: pointer;">😊</span>
            <input id="msg-input" style="flex:1; border:none; outline:none; font-size: 14px;" placeholder="Message..." autocomplete="off">
            <button id="send-btn" style="background:none; border:none; color:#0095f6; font-weight:600; cursor:pointer; font-size:14px;">Send</button>
        </div>
    </div>

<script>
const otherUser = "{{ other_user.username }}"; 
const currentUser = "{{ user.username }}";
const chatBox = document.getElementById("chat-box");
const typingIndicator = document.getElementById("typing-indicator");
const statusSpan = document.getElementById("user-status"); 
const input = document.getElementById("msg-input");
const sendBtn = document.getElementById("send-btn");

// Pagination Variables
let currentPage = 1;
let hasNextPage = true;
let isLoading = false;

// =======================
// HELPER FUNCTIONS
// =======================

function getTickIcon(isRead) {
    if (isRead) return '<span class="tick read">✓✓</span>';
    return '<span class="tick delivered">✓✓</span>';
}

function createMessageHTML(msg) {
    const isMe = msg.sender === currentUser;
    
    // Only show ticks if I am the sender
    const tickHtml = isMe ? getTickIcon(msg.is_read) : "";

    return `
        <div class="msg-row ${isMe ? 'sent-row' : 'received-row'}">
            <div id="msg-${msg.id}" class="bubble ${isMe ? 'sent-bubble' : 'received-bubble'}">
                <span>${msg.message}</span>
                <div class="msg-footer">
                    <span>${msg.timestamp}</span>
                    ${tickHtml}
                </div>
            </div>
        </div>
    `;
}

// =======================
// LOAD HISTORY
// =======================
async function loadChatHistory(page = 1) {
    if (isLoading || !hasNextPage) return;
    isLoading = true;

    const oldScrollHeight = chatBox.scrollHeight;

    try {
        const response = await fetch(`/chat/history/${otherUser}/?page=${page}`);
        const data = await response.json();
        
        hasNextPage = data.has_next;

        let html = "";
        data.messages.forEach(msg => {
            html += createMessageHTML(msg);
        });

        if (page === 1) {
            chatBox.innerHTML = html;
            chatBox.scrollTop = chatBox.scrollHeight;
        } else {
            chatBox.insertAdjacentHTML('afterbegin', html);
            chatBox.scrollTop = chatBox.scrollHeight - oldScrollHeight;
        }

    } catch (err) {
        console.error("Failed to load chat", err);
    } finally {
        isLoading = false;
    }
}
loadChatHistory(1);

chatBox.addEventListener('scroll', () => {
    if (chatBox.scrollTop === 0 && !isLoading && hasNextPage) {
        currentPage++;
        loadChatHistory(currentPage);
    }
});


// =======================
// WEBSOCKET LOGIC
// =======================
const socket = new WebSocket(
    "ws://" + window.location.host + "/ws/chat/" + otherUser + "/"
);

socket.onmessage = (e) => {
    const data = JSON.parse(e.data);

    // 1. TYPING INDICATOR
    if (data.type === "typing" && data.user !== currentUser) {
        if (statusSpan) statusSpan.style.display = "none"; // Hide status
        typingIndicator.style.display = "block"; // Show typing
        typingIndicator.innerText = "typing...";
        
        clearTimeout(window.typingTimer);
        window.typingTimer = setTimeout(() => {
            typingIndicator.style.display = "none";
            if (statusSpan) statusSpan.style.display = "block"; // Show status back
        }, 1500);
        return;
    }
    // 2. READ RECEIPT (Blue Tick Update)
    if (data.type === "message_read") {
        if (data.reader !== currentUser) {
            // Find message by ID and update tick to Blue
            const bubble = document.getElementById(`msg-${data.message_id}`);
            if (bubble) {
                const tick = bubble.querySelector(".tick");
                if (tick) {
                    tick.classList.remove("delivered");
                    tick.classList.add("read"); // Turns blue
                }
            }
        }
        return;
    }

    // 3. NEW MESSAGE
    if (data.type === "chat_message") {
        // Construct message object (use ID from backend)
        const msgObj = {
            id: data.id,
            sender: data.sender,
            message: data.message,
            timestamp: data.timestamp, 
            is_read: false 
        };

        // Render Message
        const div = document.createElement("div");
        div.innerHTML = createMessageHTML(msgObj);
        chatBox.appendChild(div.firstElementChild);
        chatBox.scrollTop = chatBox.scrollHeight;

        // CRITICAL: If I am the receiver, tell server I read it!
        if (data.sender !== currentUser) {
            socket.send(JSON.stringify({
                command: "read_receipt",
                message_id: data.id
            }));
        }
    }
};

// =======================
// SEND MESSAGE
// =======================
function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    // Send structure matching backend
    socket.send(JSON.stringify({ message: message }));
    input.value = "";
}

sendBtn.onclick = sendMessage;

input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
    else socket.send(JSON.stringify({ typing: true }));
});
</script>

{% endblock %}
