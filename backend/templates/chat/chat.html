<style>
    /* ============================
       INSTAGRAM DM STYLES
       ============================ */
    
    /* Overlay & Window */
    #chat-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 2001; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
    .chat-window { background: #fff; width: 100%; max-width: 450px; height: 85vh; border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 1px solid #dbdbdb; }
    
    /* Header */
    .c-header { padding: 15px; border-bottom: 1px solid #dbdbdb; display: flex; align-items: center; justify-content: space-between; background: #fff; height: 60px; }
    .chat-header-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; margin-right: 12px; border: 1px solid #dbdbdb; }
    .chat-header-placeholder { width: 32px; height: 32px; background: #fafafa; border-radius: 50%; margin-right: 12px; display: flex; justify-content: center; align-items: center; font-size: 16px; border: 1px solid #dbdbdb; }
    
    /* Messages Area */
    .c-messages { flex: 1; overflow-y: auto; padding: 20px 15px; background: #fff; display: flex; flex-direction: column; gap: 2px; }
    
    /* Message Rows */
    .msg-row { display: flex; width: 100%; margin-bottom: 4px; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* BUBBLES */
    .msg-bubble { 
        max-width: 70%; 
        padding: 10px 16px; 
        border-radius: 22px; /* Super round pill shape */
        font-size: 14px; 
        line-height: 1.4; 
        position: relative; 
        word-wrap: break-word; 
    }

    /* SENT: Instagram Gradient */
    .msg-sent { justify-content: flex-end; }
    .msg-sent .msg-bubble { 
        background: linear-gradient(135deg, #962fbf, #4f5bd5); /* The Insta Gradient */
        color: white; 
        border-bottom-right-radius: 4px; /* Subtle visual anchor */
    }
    
    /* RECEIVED: Light Grey */
    .msg-received { justify-content: flex-start; }
    .msg-received .msg-bubble { 
        background: #efefef; 
        color: #262626; 
        border: 1px solid #efefef;
        border-bottom-left-radius: 4px; 
    }
    
    /* Footer & Ticks */
    .msg-footer { display: flex; justify-content: flex-end; align-items: center; margin-top: 4px; opacity: 0.7; }
    .msg-time { font-size: 10px; margin-right: 4px; }
    
    /* Ticks */
        .tick { 
            font-size: 11px; 
            font-weight: bold; 
            line-height: 1; 
            display: inline-block; 
            margin-left: 4px;
        }
        
        /* 1. Sent (Single Tick) */
        .tick.sent { color: rgba(255, 255, 255, 0.7); } /* Light White for Sent */
        .tick.sent::after { content: '✓'; }
    
        /* 2. Delivered (Double Tick) */
        .tick.delivered { color: rgba(255, 255, 255, 0.7); } /* Light White for Delivered */
        .tick.delivered::after { content: '✓✓'; letter-spacing: -2px; }
    
        /* 3. Read (Double BLUE Tick) */
        /* I used a brighter Cyan Blue so it pops against the Purple background */
        .tick.read { color: #00ffff; text-shadow: 0 0 2px rgba(0,0,0,0.2); } 
        .tick.read::after { content: '✓✓'; letter-spacing: -2px; }

    /* Input Area */
    .c-input { padding: 15px; display: flex; gap: 10px; align-items: center; background: #fff; }
    #popup-chat-input {
        flex: 1;
        background: #efefef; /* Instagram grey input */
        border: none;
        padding: 12px 20px;
        border-radius: 25px; /* Pill shape */
        outline: none;
        font-size: 14px;
    }
    #popup-chat-input::placeholder { color: #8e8e8e; }

    /* Typing Text */
    @keyframes blink { 50% { opacity: 0; } }
    .typing-text { color: #8e8e8e; font-size: 12px; margin-left: 5px; animation: blink 1s infinite; }
</style>

<div id="chat-overlay">
    <div class="chat-window">
        <div class="c-header">
            <div style="display:flex; align-items:center;">
                <button onclick="closeChatPopup()" style="border:none; background:none; font-size:24px; margin-right:15px; cursor:pointer; color:#262626;">&larr;</button>
                
                <div id="chat-header-img-container">
                    <div class="chat-header-placeholder">👤</div>
                </div>

                <div>
                    <div id="chat-header-name" style="font-weight:600; font-size:16px; color:#262626;">User</div>
                    <div id="chat-status-wrapper" style="font-size:12px;">
                        <span id="chat-header-status" style="color:#8e8e8e;">Connecting...</span>
                        <span id="chat-typing-indicator" class="typing-text" style="display:none;">typing...</span>
                    </div>
                </div>
            </div>
            <div style="display:flex; gap:15px;">
                <button onclick="triggerCall('audio')" style="border:none; background:none; font-size:22px; cursor:pointer;">📞</button>
                <button onclick="triggerCall('video')" style="border:none; background:none; font-size:24px; cursor:pointer;">📹</button>
            </div>
        </div>

        <div id="popup-chat-box" class="c-messages"></div>

        <div class="c-input">
            <input type="text" id="popup-chat-input" placeholder="Message..." autocomplete="off">
            <button onclick="sendPopupMessage()" style="border:none; background:none; color:#0095f6; font-weight:600; cursor:pointer; font-size:14px;">Send</button>
        </div>
    </div>
</div>

<script>
    // Variables for the Active Chat
    let activeChatUser = null;
    let activeChatSocket = null;
    let activePage = 1;
    let activeHasNext = true;
    let activeLoading = false;
    let typingTimer = null;

    // --- HELPER: Generate Tick HTML ---
    function getTickHtml(isRead) {
        // WhatsApp logic inside Instagram style bubble
        // If read -> Double Tick. If not read -> Double Tick (Delivered).
        // (Note: In a real app, you'd check 'is_delivered' too, here we simplify)
        const status = isRead ? 'read' : 'delivered';
        return `<span class="tick ${status}"></span>`;
    }

    // --- HELPER: Generate Message Bubble HTML ---
    function createMsgHtml(msg) {
        const isMe = msg.sender === currentUserName;
        let tickContent = "";
        
        // Only show ticks on MY messages (sent by me)
        if (isMe) {
            tickContent = getTickHtml(msg.is_read);
        }

        return `
            <div class="msg-row ${isMe ? 'msg-sent' : 'msg-received'}">
                <div class="msg-bubble" id="msg-${msg.id}">
                    <span>${msg.message}</span>
                    <div class="msg-footer">
                        <span class="msg-time">${msg.timestamp}</span>
                        ${tickContent}
                    </div>
                </div>
            </div>`;
    }

    // 1. OPEN CHAT FUNCTION
    async function openChatPopup(username, avatarUrl) {
        document.getElementById('inbox-overlay').style.display = 'none';
        document.getElementById('chat-overlay').style.display = 'flex';
        
        activeChatUser = username;
        document.getElementById('chat-header-name').innerText = username;
        document.getElementById('chat-header-status').innerText = "Updating...";
        document.getElementById('chat-header-status').style.display = "inline";
        document.getElementById('chat-typing-indicator').style.display = "none";
        document.getElementById('popup-chat-box').innerHTML = ""; 
        
        // Avatar
        const imgContainer = document.getElementById('chat-header-img-container');
        if (avatarUrl && avatarUrl !== "null" && avatarUrl !== "undefined" && avatarUrl !== "") {
            imgContainer.innerHTML = `<img src="${avatarUrl}" class="chat-header-avatar">`;
        } else {
            imgContainer.innerHTML = `<div class="chat-header-placeholder">👤</div>`;
        }
        
        activePage = 1;
        activeHasNext = true;

        connectChatSocket(username);
        await loadPopupHistory(1);
    }

    // 2. CLOSE CHAT
    function closeChatPopup() {
        document.getElementById('chat-overlay').style.display = 'none';
        if(activeChatSocket) activeChatSocket.close();
        activeChatUser = null;
    }

    // 3. LOAD HISTORY
    async function loadPopupHistory(page) {
        if(activeLoading || !activeHasNext) return;
        activeLoading = true;
        
        try {
            const res = await fetch(`/chat/history/${activeChatUser}/?page=${page}`);
            const data = await res.json();
            
            // Update Status
            if(page === 1 && data.user_data) {
                const statusDiv = document.getElementById('chat-header-status');
                statusDiv.innerText = data.user_data.status_text;
                statusDiv.style.color = data.user_data.is_online ? "#8e8e8e" : "#8e8e8e"; // Instagram keeps status grey usually
                if(data.user_data.is_online) statusDiv.innerText = "Active now";
            }

            activeHasNext = data.has_next;
            
            const box = document.getElementById('popup-chat-box');
            let html = "";
            data.messages.forEach(msg => {
                html += createMsgHtml(msg);
            });
            
            if(page === 1) {
                box.innerHTML = html;
                box.scrollTop = box.scrollHeight;
            } else {
                const oldH = box.scrollHeight;
                box.insertAdjacentHTML('afterbegin', html);
                box.scrollTop = box.scrollHeight - oldH;
            }

        } catch(e) { console.error(e); }
        finally { activeLoading = false; }
    }

    // 4. WEBSOCKET LOGIC
    function connectChatSocket(username) {
        if(activeChatSocket) activeChatSocket.close();
        const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        activeChatSocket = new WebSocket(protocol + window.location.host + "/ws/chat/" + username + "/");

        activeChatSocket.onmessage = (e) => {
            const data = JSON.parse(e.data);

            // Typing
            if (data.type === "typing" && data.user !== currentUserName) {
                const statusDiv = document.getElementById('chat-header-status');
                const typingDiv = document.getElementById('chat-typing-indicator');
                
                statusDiv.style.display = "none";
                typingDiv.style.display = "inline";
                
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => {
                    typingDiv.style.display = "none";
                    statusDiv.style.display = "inline";
                }, 1500);
                return;
            }

            // Read Receipt
            if (data.type === "message_read") {
                if (data.reader !== currentUserName) {
                    const bubble = document.querySelector(`#msg-${data.message_id}`);
                    if (bubble) {
                        const tick = bubble.querySelector(".tick");
                        if (tick) tick.className = "tick read";
                    }
                }
                return;
            }

            // New Message
            if (data.type === "chat_message") {
                const box = document.getElementById('popup-chat-box');
                
                const msgObj = {
                    id: data.id,
                    message: data.message,
                    timestamp: data.timestamp || "Now",
                    sender: data.sender,
                    is_read: false 
                };

                const html = createMsgHtml(msgObj);
                box.insertAdjacentHTML('beforeend', html);
                box.scrollTop = box.scrollHeight;

                if (data.sender !== currentUserName) {
                    activeChatSocket.send(JSON.stringify({
                        command: "read_receipt",
                        message_id: data.id
                    }));
                }
            }
        };
    }

    // 5. SEND MESSAGE
    function sendPopupMessage() {
        const input = document.getElementById('popup-chat-input');
        const txt = input.value.trim();
        if(!txt || !activeChatSocket) return;
        
        activeChatSocket.send(JSON.stringify({ message: txt }));
        input.value = "";
    }
    
    document.getElementById('popup-chat-input').addEventListener("keypress", function(e){
        if(e.key === "Enter") {
            sendPopupMessage();
        } else {
            if(activeChatSocket) activeChatSocket.send(JSON.stringify({ typing: true }));
        }
    });

    // 6. CALL TRIGGER
    function triggerCall(mode) {
        if(activeChatUser && window.startGlobalCall) {
            closeChatPopup(); 
            window.startGlobalCall(activeChatUser, mode);
        } else {
            alert("Call system initializing...");
        }
    }

    // Infinite Scroll
    document.getElementById('popup-chat-box').addEventListener('scroll', function() {
        if(this.scrollTop === 0 && activeHasNext) {
            activePage++;
            loadPopupHistory(activePage);
        }
    });
</script>
