{% extends "base.html" %}
{% block content %}

<style>
    /* ============================
       INSTAGRAM STYLE CSS
       ============================ */
    body {
        margin: 0;
        background-color: #fafafa;
    }

    /* Main Container */
    .chat-container {
        background: #fff;
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* DESKTOP: Centered Box */
    @media (min-width: 768px) {
        .chat-container {
            max-width: 600px;
            height: 85vh;
            margin: 30px auto;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
    }

    /* MOBILE: Full Screen */
    @media (max-width: 767px) {
        .chat-container {
            width: 100%;
            height: 100vh;
            border: none;
            margin: 0;
        }
    }

    /* Header */
    .chat-header {
        height: 60px;
        padding: 0 15px;
        border-bottom: 1px solid #efefef;
        display: flex;
        align-items: center;
        flex-shrink: 0;
        background: #fff;
        border-radius: 8px 8px 0 0;
    }

    /* Chat Area */
    #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background-color: #fff;
        display: flex;
        flex-direction: column;
    }
    
    /* Scrollbar Styling */
    #chat-box::-webkit-scrollbar { width: 6px; }
    #chat-box::-webkit-scrollbar-thumb { background-color: #cccccc; border-radius: 4px; }

    /* Bubbles */
    .bubble {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 22px;
        font-size: 14px;
        line-height: 1.4;
        max-width: 70%;
        word-wrap: break-word;
        position: relative;
    }

    /* SENT (Right, Gradient) */
    .sent-bubble {
        background: linear-gradient(90deg, #962fbf, #4f5bd5); /* Instagram Gradient */
        color: white;
        border-bottom-right-radius: 4px; /* Slight edge */
    }

    /* RECEIVED (Left, Gray) */
    .received-bubble {
        background-color: #efefef;
        color: #262626;
        border: 1px solid #efefef;
        border-bottom-left-radius: 4px;
    }

    /* Input Area */
    .input-area {
        padding: 15px;
        border-top: 1px solid #efefef;
        display: flex;
        align-items: center;
        background: #fff;
        border-radius: 0 0 8px 8px;
    }

    .input-wrapper {
        flex: 1;
        border: 1px solid #dbdbdb;
        border-radius: 22px;
        padding: 8px 15px;
        display: flex;
        align-items: center;
        background: #fff;
    }
</style>

<div class="chat-container">

    <div class="chat-header">
        <div style="width: 32px; height: 32px; border-radius: 50%; background: #dbdbdb; margin-right: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
             <svg aria-label="Profile" color="#fff" fill="#fff" height="24" viewBox="0 0 48 48" width="24"><path d="M24 0C10.7 0 0 10.7 0 24s10.7 24 24 24 24-10.7 24-24S37.3 0 24 0zm0 7.2c4.1 0 7.4 3.3 7.4 7.4 0 4.1-3.3 7.4-7.4 7.4-4.1 0-7.4-3.3-7.4-7.4 0-4.1 3.3-7.4 7.4-7.4zm0 33.6c-5.3 0-10-2.3-13.2-5.9 1-5.1 5.5-9 10.8-9h4.8c5.3 0 9.8 3.8 10.8 9-3.2 3.6-7.9 5.9-13.2 5.9z"></path></svg>
        </div>
        
        <div style="display: flex; flex-direction: column;">
            <strong style="font-size: 16px;">{{ other_user }}</strong>
            <span id="typing-indicator" style="font-size:12px; color:#8e8e8e; height: 14px;"></span>
        </div>
    </div>

    <div id="chat-box">
        </div>

    <div class="input-area">
        <div class="input-wrapper">
            <span style="font-size: 20px; margin-right: 8px; cursor: pointer;">😊</span>
            <input
                id="msg-input"
                style="flex:1; border:none; outline:none; font-size: 14px;"
                placeholder="Message..."
                autocomplete="off"
            >
            <button id="send-btn" style="background:none; border:none; color:#0095f6; font-weight:600; cursor:pointer; font-size:14px;">Send</button>
        </div>
    </div>

</div>

<script>
const otherUser = "{{ other_user }}";
const currentUser = "{{ user.username }}";

const chatBox = document.getElementById("chat-box");
const typingIndicator = document.getElementById("typing-indicator");
const input = document.getElementById("msg-input");


// =======================
// LOAD CHAT HISTORY (AJAX)
// =======================
async function loadChatHistory() {
    const response = await fetch(`/chat/history/${otherUser}/`);
    const messages = await response.json();

    chatBox.innerHTML = "";

    messages.forEach(msg => {
        const div = document.createElement("div");
        div.style.marginBottom = "8px";
        div.style.textAlign = msg.sender === currentUser ? "right" : "left";

        // UPDATED STYLING: using 'sent-bubble' (gradient) and 'received-bubble' classes
        div.innerHTML = `
            <span class="bubble ${msg.sender === currentUser ? 'sent-bubble' : 'received-bubble'}">
                ${msg.message}
                ${msg.sender === currentUser && msg.is_read ? " <span style='font-size:10px; margin-left:4px;'>✔✔</span>" : ""}
            </span>
        `;

        chatBox.appendChild(div);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}

// 🔥 Load history when page opens
loadChatHistory();


// =======================
// WEBSOCKET
// =======================
const socket = new WebSocket(
    "ws://" + window.location.host + "/ws/chat/" + otherUser + "/"
);


// RECEIVE MESSAGE / TYPING
socket.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.typing) {
        typingIndicator.innerText = `${data.user} is typing...`;
        setTimeout(() => typingIndicator.innerText = "", 1000);
        return;
    }

    const div = document.createElement("div");
    div.style.marginBottom = "8px";
    div.style.textAlign = data.sender === currentUser ? "right" : "left";

    // UPDATED STYLING: using 'sent-bubble' and 'received-bubble' classes
    div.innerHTML = `
        <span class="bubble ${data.sender === currentUser ? 'sent-bubble' : 'received-bubble'}">
            ${data.message}
        </span>
    `;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
};


// =======================
// SEND MESSAGE
// =======================
document.getElementById("send-btn").onclick = sendMessage;

input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
        sendMessage();
    } else {
        socket.send(JSON.stringify({ typing: true }));
    }
});

function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    socket.send(JSON.stringify({ message }));
    input.value = "";
}
</script>

{% endblock %}
