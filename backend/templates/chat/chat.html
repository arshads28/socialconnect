{% extends "base.html" %}
{% block content %}

<div style="
    max-width:500px;
    margin:20px auto;
    background:#fff;
    border:1px solid #dbdbdb;
    display:flex;
    flex-direction:column;
">

    <!-- Header -->
    <div style="padding:10px; border-bottom:1px solid #dbdbdb;">
        <strong>{{ other_user }}</strong>
        <span id="typing-indicator" style="font-size:12px; color:#777; margin-left:10px;"></span>
    </div>

    <!-- Chat messages -->
    <div id="chat-box" style="height:400px; overflow-y:auto; padding:10px;">
        <!-- Messages will be loaded via AJAX -->
    </div>

    <!-- Input -->
    <div style="display:flex; border-top:1px solid #dbdbdb;">
        <input
            id="msg-input"
            style="flex:1; padding:10px; border:none; outline:none;"
            placeholder="Message…"
        >
        <button id="send-btn" style="padding:10px;">Send</button>
    </div>

</div>

<script>
const otherUser = "{{ other_user }}";
const currentUser = "{{ user.username }}";

const chatBox = document.getElementById("chat-box");
const typingIndicator = document.getElementById("typing-indicator");
const input = document.getElementById("msg-input");


// =======================
// LOAD CHAT HISTORY (AJAX)
// =======================
async function loadChatHistory() {
    const response = await fetch(`/chat/history/${otherUser}/`);
    const messages = await response.json();

    chatBox.innerHTML = "";

    messages.forEach(msg => {
        const div = document.createElement("div");
        div.style.marginBottom = "8px";
        div.style.textAlign = msg.sender === currentUser ? "right" : "left";

        div.innerHTML = `
            <span style="
                display:inline-block;
                padding:8px 12px;
                border-radius:18px;
                background:${msg.sender === currentUser ? "#dcf8c6" : "#f1f0f0"};
            ">
                ${msg.message}
                ${msg.sender === currentUser && msg.is_read ? " ✔✔" : ""}
            </span>
        `;

        chatBox.appendChild(div);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}

// 🔥 Load history when page opens
loadChatHistory();


// =======================
// WEBSOCKET
// =======================
const socket = new WebSocket(
    "ws://" + window.location.host + "/ws/chat/" + otherUser + "/"
);


// RECEIVE MESSAGE / TYPING
socket.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.typing) {
        typingIndicator.innerText = `${data.user} is typing...`;
        setTimeout(() => typingIndicator.innerText = "", 1000);
        return;
    }

    const div = document.createElement("div");
    div.style.marginBottom = "8px";
    div.style.textAlign = data.sender === currentUser ? "right" : "left";

    div.innerHTML = `
        <span style="
            display:inline-block;
            padding:8px 12px;
            border-radius:18px;
            background:${data.sender === currentUser ? "#dcf8c6" : "#f1f0f0"};
        ">
            ${data.message}
        </span>
    `;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
};


// =======================
// SEND MESSAGE
// =======================
document.getElementById("send-btn").onclick = sendMessage;

input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
        sendMessage();
    } else {
        socket.send(JSON.stringify({ typing: true }));
    }
});

function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    socket.send(JSON.stringify({ message }));
    input.value = "";
}
</script>

{% endblock %}
