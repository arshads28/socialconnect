<style>
/* =========================
   1. GLOBAL & SAFE AREAS
   ========================= */
:root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --bg-black: #000;
    --text-white: #fff;
    --accent: #e60023;
}

#create-post-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg-black);
    z-index: 4000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* =========================
   2. CAMERA INTERFACE
   ========================= */
#camera-interface {
    position: relative;
    width: 100%;
    height: 100%;
    display: block; 
}

#camera-stream {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Filter Effect */
.natural-filter-active {
    filter: brightness(1.1) contrast(1.05) saturate(1.15);
}

/* Camera Header */
.camera-top-bar {
    position: absolute;
    top: calc(10px + var(--safe-top));
    left: 20px;
    z-index: 20;
}
.camera-close-btn {
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
    color: white;
    border: none;
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
}

/* Camera Footer */
.camera-bottom-bar {
    position: absolute;
    bottom: calc(20px + var(--safe-bottom));
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 30px;
    z-index: 20;
}

.left-action { justify-self: start; }
.right-action { justify-self: end; display: flex; gap: 15px; }

.cam-icon-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: 0.2s;
}

.filter-btn-active { background: var(--accent); border-color: var(--accent); }

.shutter-button-outer {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 5px solid white;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
}
.shutter-button-inner {
    width: 64px; height: 64px;
    background: white; border-radius: 50%;
    transition: 0.1s;
}
.shutter-button-outer:active .shutter-button-inner { transform: scale(0.9); }

.gallery-wrapper { position: relative; overflow: hidden; }
.gallery-wrapper input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }


/* =========================
   3. PREVIEW INTERFACE (FIXED LAYOUT)
   ========================= */
#preview-interface {
    display: none;
    flex-direction: column;
    height: 100%;
    background: #000;
}

/* Header */
.cp-header {
    padding: calc(15px + var(--safe-top)) 20px 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #000;
    z-index: 30;
    border-bottom: 1px solid #222;
}
.btn-text {
    background: none; border: none;
    color: white; font-size: 16px; font-weight: 600;
    cursor: pointer;
}
.btn-post {
    background: var(--accent);
    color: white;
    padding: 8px 24px;
    border-radius: 20px;
    font-weight: 700;
    border: none;
    cursor: pointer;
}

/* FIX: Content Layout 
   Caption stays at top (under header) so keyboard doesn't hide it.
   Image fills the rest.
*/
.cp-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Caption Input Area */
.caption-container {
    background: #000;
    padding: 20px;
    border-bottom: 1px solid #222;
    flex-shrink: 0; /* Prevents shrinking */
}

.cp-textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
    font-family: inherit;
    resize: none;
    min-height: 60px; /* Compact height */
}
.cp-textarea::placeholder { color: #666; }

/* Image Area */
.preview-media-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    overflow: hidden;
    position: relative;
}

#cp-media-preview {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
}

#hidden-canvas { display: none; }
</style>

<div id="create-post-overlay">
    <canvas id="hidden-canvas"></canvas>

    <div id="camera-interface">
        <video id="camera-stream" autoplay playsinline muted></video>

        <div class="camera-top-bar">
            <button class="camera-close-btn" onclick="toggleCreatePost()">&times;</button>
        </div>

        <div class="camera-bottom-bar">
            <div class="left-action">
                <div class="cam-icon-btn gallery-wrapper">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    <input type="file" accept="image/*" onchange="handleGallerySelect(event)">
                </div>
            </div>

            <div class="shutter-button-outer" onclick="capturePhoto()">
                <div class="shutter-button-inner"></div>
            </div>

            <div class="right-action">
                <div id="filter-btn" class="cam-icon-btn" onclick="toggleFilter()">✨</div>
                <div class="cam-icon-btn" onclick="switchCamera()">🔄</div>
            </div>
        </div>
    </div>

    <form id="preview-interface" method="POST" action="{% url 'create_post' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="media" id="final-media-input" hidden>

        <div class="cp-header">
            <button type="button" class="btn-text" onclick="backToCamera()">❮ Retake</button>
            <button type="submit" class="btn-post">Post</button>
        </div>

        <div class="cp-body">
            <div class="caption-container">
                <textarea name="content" class="cp-textarea" placeholder="Write a caption..."></textarea>
            </div>

            <div class="preview-media-container">
                <img id="cp-media-preview">
            </div>
        </div>
    </form>
</div>

<script>
let stream = null;
let cameras = [];
let camIndex = 0;
let filterActive = false;

/* --- SAFETY CLEANUP --- */
function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
}

/* --- CAMERA INIT --- */
async function prepareCameras() {
    if (cameras.length) return;
    try {
        const temp = await navigator.mediaDevices.getUserMedia({ video: true });
        temp.getTracks().forEach(t => t.stop());
        
        const devices = await navigator.mediaDevices.enumerateDevices();
        cameras = devices.filter(d => d.kind === "videoinput");

        if (cameras.length <= 1) {
            // Hide switch button if only 1 camera
            const switchBtn = document.querySelector('[onclick="switchCamera()"]');
            if(switchBtn) switchBtn.style.display = "none";
        }
    } catch(e) { console.log(e); }
}

async function startCamera() {
    await prepareCameras();
    stopCamera();

    if (cameras.length === 0) return;

    const cam = cameras[camIndex];
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                deviceId: { exact: cam.deviceId },
                width: { ideal: 1280 }, // Good HD quality
                height: { ideal: 720 }
            },
            audio: false
        });

        const video = document.getElementById("camera-stream");
        video.srcObject = stream;

        // Mirror logic
        const label = cam.label.toLowerCase();
        const front = label.includes("front") || label.includes("user");
        video.style.transform = front ? "scaleX(-1)" : "scaleX(1)";
        video.dataset.mirror = front; // Save for capture

        applyFilter();
    } catch(e) { console.error("Cam start failed", e); }
}

async function switchCamera() {
    if (cameras.length < 2) return;
    camIndex = (camIndex + 1) % cameras.length;
    await startCamera();
}

/* --- UI --- */
function toggleCreatePost() {
    const overlay = document.getElementById("create-post-overlay");
    if (overlay.style.display === "flex") {
        overlay.style.display = "none";
        stopCamera();
    } else {
        overlay.style.display = "flex";
        document.getElementById("camera-interface").style.display = "block";
        document.getElementById("preview-interface").style.display = "none";
        startCamera();
    }
}

function toggleFilter() {
    filterActive = !filterActive;
    applyFilter();
}

function applyFilter() {
    const video = document.getElementById("camera-stream");
    const btn = document.getElementById("filter-btn");
    
    video.classList.toggle("natural-filter-active", filterActive);
    btn.classList.toggle("filter-btn-active", filterActive);
}

/* --- CAPTURE --- */
function capturePhoto() {
    const video = document.getElementById("camera-stream");
    const canvas = document.getElementById("hidden-canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // Reset & Apply Mirror
    ctx.setTransform(1,0,0,1,0,0);
    if (video.dataset.mirror === "true") {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
    }

    // Apply Filter
    ctx.filter = filterActive
        ? 'brightness(1.1) contrast(1.05) saturate(1.15)'
        : 'none';

    ctx.drawImage(video, 0, 0);

    // Save & Switch
    const url = canvas.toDataURL("image/jpeg");
    document.getElementById("cp-media-preview").src = url;
    setInputFiles(dataURLToBlob(url));

    document.getElementById("camera-interface").style.display = "none";
    document.getElementById("preview-interface").style.display = "flex";
    stopCamera();
}

/* --- HELPERS --- */
function handleGallerySelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById("cp-media-preview").src = URL.createObjectURL(file);
    setInputFiles(file);
    document.getElementById("camera-interface").style.display = "none";
    document.getElementById("preview-interface").style.display = "flex";
    stopCamera();
}

function backToCamera() {
    document.getElementById("preview-interface").style.display = "none";
    document.getElementById("camera-interface").style.display = "block";
    startCamera();
}

function setInputFiles(file) {
    const dt = new DataTransfer();
    dt.items.add(file);
    document.getElementById("final-media-input").files = dt.files;
}

function dataURLToBlob(dataURL) {
    const [meta, data] = dataURL.split(",");
    const mime = meta.match(/:(.*?);/)[1];
    const bin = atob(data);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], "photo.jpg", { type: mime });
}
</script>
