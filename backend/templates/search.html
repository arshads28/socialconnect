<style>
    /* SEARCH OVERLAY */
    #search-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: rgba(255, 255, 255, 0.98);
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        padding-top: 20px;
    }

    /* Desktop adjustment */
    @media (min-width: 768px) {
        #search-overlay {
            padding-top: 80px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
        }
    }

    .search-modal {
        width: 100%;
        max-width: 500px;
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    /* HEADER */
    .search-bar-header {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-bottom: 20px;
    }

    .search-bar-wrapper { position: relative; flex: 1; }

    .s-input {
        width: 100%;
        background: #efefef;
        border: none;
        border-radius: 50px;
        padding: 12px 20px;
        font-size: 16px;
        outline: none;
    }
    
    .close-search-btn {
        border: none;
        background: transparent;
        font-weight: 600;
        color: #111;
        font-size: 16px;
        padding: 10px;
        cursor: pointer;
    }

    /* RESULTS LIST */
    #search-results-list {
        width: 100%;
        flex: 1;
        overflow-y: auto;
        padding-bottom: 80px;
    }

    /* ROW STYLING */
    .s-user-row {
        display: flex;
        align-items: center;
        justify-content: space-between; /* Pushes button to right */
        padding: 12px 5px;
        border-bottom: 1px solid #fafafa;
    }

    /* LEFT SIDE: PROFILE LINK (Clickable Area) */
    .s-profile-link {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
        flex: 1; /* Takes up all remaining space */
        cursor: pointer;
    }

    .s-avatar-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #ddd; }
    .s-avatar-placeholder { width: 45px; height: 45px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    
    .s-username { font-weight: 700; font-size: 15px; color: #111; }
    .s-bio { font-size: 13px; color: #767676; }

    /* RIGHT SIDE: MESSAGE BUTTON */
    .s-msg-btn {
        background: #efefef;
        color: black;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: 0.2s;
    }
    .s-msg-btn:hover { background: #dbdbdb; }

    /* SPINNER */
    .s-loader-container { display: flex; justify-content: center; padding: 20px; }
    .s-spinner {
        width: 24px; height: 24px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #e60023;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<div id="search-overlay">
    <div class="search-modal">
        
        <div class="search-bar-header">
            <div class="search-bar-wrapper">
                <input type="text" id="live-search-input" class="s-input" placeholder="Search people..." autocomplete="off">
            </div>
            <button class="close-search-btn" onclick="closeSearchManually()">Cancel</button>
        </div>

        <div id="search-results-list">
            <div style="text-align: center; color: #999; margin-top: 40px; font-size:14px;">
                Type to find friends...
            </div>
        </div>
    </div>
</div>

<script>
    // 1. OPEN SEARCH
    function toggleSearch(e) {
        if(e && e.preventDefault) e.preventDefault();
        
        const el = document.getElementById('search-overlay');
        const input = document.getElementById('live-search-input');
        
        if (el.style.display !== 'flex') {
            el.style.display = 'flex';
            input.focus();
            history.pushState({ modal: 'search' }, null, "");
        }
    }

    // 2. CLOSE SEARCH
    function closeSearchManually() {
        history.back();
    }

    // 3. BACK BUTTON HANDLER
    window.addEventListener('popstate', function(event) {
        const searchOverlay = document.getElementById('search-overlay');
        if (searchOverlay && searchOverlay.style.display === 'flex') {
            searchOverlay.style.display = 'none';
        }
    });

    // 4. LIVE FETCH LOGIC
    const sInput = document.getElementById('live-search-input');
    const sList = document.getElementById('search-results-list');
    let sTimeout = null;

    if (sInput) {
        sInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearTimeout(sTimeout);

            if(query.length === 0) {
                sList.innerHTML = '<div style="text-align: center; color: #999; margin-top: 40px;">Type to find friends...</div>';
                return;
            }

            sTimeout = setTimeout(() => {
                // Show Loader
                sList.innerHTML = `<div class="s-loader-container"><div class="s-spinner"></div></div>`;

                fetch(`/chat/search/?q=${query}`)
                    .then(res => res.json())
                    .then(data => {
                        let html = '';
                        if(data.results.length === 0) {
                            html = '<div style="text-align:center; padding:20px; color:#999">No users found.</div>';
                        } else {
                            data.results.forEach(user => {
                                let imgHtml = user.avatar_url 
                                    ? `<img src="${user.avatar_url}" class="s-avatar-img">`
                                    : `<div class="s-avatar-placeholder">👤</div>`;
                                
                                // Assuming URL structure is /auth/profile/username or /profile/username
                                // Adjust the HREF below to match your urls.py for profile view
                                const profileUrl = `/auth/profile/${user.username}/`; 

                                html += `
                                <div class="s-user-row">
                                    <a href="/profile/${user.username}/" class="s-profile-link">
                                        ${imgHtml}
                                        <div>
                                            <div class="s-username">${user.username}</div>
                                            <div class="s-bio">${user.bio || 'Connect User'}</div>
                                        </div>
                                    </a>

                                    <button class="s-msg-btn" onclick="openChatPopup('${user.username}', '${user.avatar_url}')">
                                        Chat
                                    </button>
                                </div>`;
                            });
                        }
                        sList.innerHTML = html;
                    })
                    .catch(err => {
                        console.error(err);
                        sList.innerHTML = '<div style="text-align:center; color:red;">Error loading.</div>';
                    });
            }, 500);
        });
    }
</script>
