<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • SocialConnect</title>

    <style>
        /* 2. RESET BOX SIZING */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #fafafa;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            /* 3. FLEXIBLE WIDTH */
            width: 100%;
            max-width: 350px;
            margin: 20px;
        }

        .auth-box {
            background: #fff;
            border: 1px solid #dbdbdb;
            padding: 30px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #dbdbdb;
            background: #fafafa;
            border-radius: 3px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0095f6;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .auth-footer {
            margin-top: 10px;
            padding: 20px;
            border: 1px solid #dbdbdb;
            background: #fff;
            text-align: center;
        }

        a {
            color: #0095f6;
            text-decoration: none;
            font-weight: bold;
        }

        /* Mobile Adjustments */
        @media (max-width: 400px) {
            .auth-box {
                padding: 20px;
                border: none;
                background: transparent;
            }
            .auth-footer {
                border: none;
                background: transparent;
            }
            body {
                background: #fff;
            }
        }
    </style>
</head>
<body>

<div class="auth-container">

    <div class="auth-box">
        <div class="logo">SocialConnect</div>

        <form method="POST">
            {% csrf_token %}
        
            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >
        
            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >
        
            <button type="submit">Log In</button>
        </form>
        
        {% if form.errors %}
            <div style="color:red; margin-top:10px; font-size: 14px;">
                {{ form.errors }}
            </div>
        {% endif %}

    </div>

    <div class="auth-footer">
        Don't have an account? <a href="/auth/signup/">Sign up</a><br><br>
        <a href="{% url 'password_reset_request' %}" style="font-size: 14px; color: #00376b;">Forgot Password?</a>
    </div>

</div>

</body>
</html>
